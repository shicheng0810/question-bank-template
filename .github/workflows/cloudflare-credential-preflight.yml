# Install only as .github/workflows/cloudflare-credential-preflight.yml on main.
# No checkout, source/PR code, deployment, Telegram or GitHub contents writes.
name: cloudflare-credential-preflight
on:
  workflow_dispatch:
permissions: {}
jobs:
  read-only-credential-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read only the expected Pages project and Worker settings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          if(account!=='1cb5e6e63a6b3c3ea0ad9bb01dac30e9'||!token){console.log(JSON.stringify({credentialConfigurationValid:false}));process.exit(1);}
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function get(path){
            try{const response=await fetch(base+path,{method:'GET',headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});if(!response.ok)return {ok:false};const body=await response.json();return {ok:body.success===true,result:body.result};}catch{return {ok:false};}
          }
          const [pages,worker]=await Promise.all([get('/pages/projects/question-bank'),get('/workers/scripts/qb-do/settings')]);
          const pagesProjectMatched=pages.ok&&pages.result?.name==='question-bank';
          const workerSettingsAccessible=worker.ok&&typeof worker.result?.compatibility_date==='string'&&Array.isArray(worker.result?.bindings);
          console.log(JSON.stringify({pagesProjectMatched,workerSettingsAccessible,requestedWorker:'qb-do',readOnly:true}));
          if(!pagesProjectMatched||!workerSettingsAccessible)process.exit(1);
          NODE
